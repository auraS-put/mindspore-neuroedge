# =============================================================================
# CAM-CNN-BiLSTM training configuration
# Paper 19 (El-Dajani et al. — BTE-CNN-LSTM):
#   Adam LR=1e-3, batch=32, epochs=40
#   ReduceLROnPlateau (factor=0.8, patience=5)
# Paper 20 (Wang Y. et al. — CAM-CNN):
#   Channel attention mechanism, weighted CE loss
# =============================================================================

epochs: 40
batch_size: 32
learning_rate: 1.0e-3
weight_decay: 1.0e-4
optimizer: adam

gradient_clip_norm: 1.0

scheduler:
  name: reduce_on_plateau
  factor: 0.8
  patience: 5
  min_lr: 1.0e-6

loss:
  name: weighted_ce
  class_weights: auto
  focal_gamma: 2.0
  label_smoothing: 0.05

sampler:
  strategy: weighted
  neg_to_pos_ratio: 3

early_stopping:
  patience: 10
  monitor: val_recall
  mode: max

checkpoint:
  save_top_k: 3
  monitor: val_recall
  mode: max

mixed_precision: false
num_workers: 4
seed: 42
