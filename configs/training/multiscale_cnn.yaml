# =============================================================================
# Multi-Scale Dilated CNN training configuration
# Paper [12] (Gao et al. 2022):
#   Focal loss (handles class imbalance better than CE for 5.9% pos rate)
#   Early stopping patience 10
#   Leave-one-out CV per patient
# Adapted for our LOSO benchmark:
#   Adam LR=1e-3, batch=64, cosine schedule with 5-epoch warmup
# =============================================================================

epochs: 100
batch_size: 64
learning_rate: 1.0e-3
weight_decay: 1.0e-4
optimizer: adam

gradient_clip_norm: 1.0

scheduler:
  name: cosine_annealing
  warmup_epochs: 5
  min_lr: 1.0e-6

loss:
  name: focal
  class_weights: auto
  focal_gamma: 2.0
  label_smoothing: 0.0

sampler:
  strategy: weighted
  neg_to_pos_ratio: 3

early_stopping:
  patience: 15
  monitor: val_recall
  mode: max

checkpoint:
  save_top_k: 3
  monitor: val_recall
  mode: max

mixed_precision: false
num_workers: 4
seed: 42
