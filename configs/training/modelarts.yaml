# ModelArts cloud training configuration
# Uses GPU (V100) for cost-effective training; switch to Ascend for production
defaults:
  - default

epochs: 100
batch_size: 256                  # GPU V100 can handle this with 4ch × 1024
mixed_precision: true            # FP16 on GPU/Ascend

# ModelArts-specific
modelarts:
  enabled: true
  data_url: obs://auras-experiments/data/processed/
  train_url: obs://auras-experiments/runs/
  device_target: GPU
  device_num: 1
